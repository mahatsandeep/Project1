<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>About Sandeep</title>
    <style>
      :root { color-scheme: dark; --ink:#f8fbff; --muted:#b6c1d8; --blue:#65d6ff; --pink:#ff79c6; }
      * { box-sizing:border-box; } body { min-height:100vh; margin:0; padding:7rem 1.25rem 3rem; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 8% 12%,#553cc9 0,transparent 29rem),radial-gradient(circle at 94% 80%,#007fb3 0,transparent 27rem),#101827; }
      nav { position:fixed; top:1.5rem; right:clamp(1.25rem,5vw,4rem); display:flex; gap:.45rem; } nav a { padding:.55rem .85rem; border:1px solid rgba(255,255,255,.13); border-radius:999px; color:var(--ink); background:rgba(16,24,39,.45); text-decoration:none; font-size:.9rem; font-weight:700; backdrop-filter:blur(12px); } nav a:hover,nav a[aria-current="page"] { color:#06121d; background:var(--blue); }
      main { width:min(92vw,900px); margin:auto; padding:clamp(2rem,6vw,4.5rem); border:1px solid rgba(255,255,255,.2); border-radius:28px; background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05)); box-shadow:0 24px 80px rgba(0,0,0,.35); backdrop-filter:blur(18px); animation:enter .7s ease both; }
      .eyebrow { color:var(--blue); font-size:.78rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:.5rem 0 1.3rem; font-size:clamp(3rem,8vw,5.7rem); letter-spacing:-.07em; line-height:.95; background:linear-gradient(105deg,#fff,var(--blue),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; } p { max-width:42rem; color:var(--muted); font-size:1.1rem; line-height:1.7; } .facts { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:2rem; } .fact { padding:1.2rem; border:1px solid rgba(255,255,255,.12); border-radius:16px; background:rgba(255,255,255,.06); } .fact strong { display:block; color:var(--blue); font-size:1.5rem; } .fact span { color:var(--muted); font-size:.9rem; } .button { display:inline-block; margin-top:2rem; padding:.85rem 1.25rem; border-radius:12px; color:#07121e; background:linear-gradient(135deg,var(--blue),#b3a0ff); font-weight:800; text-decoration:none; } @keyframes enter { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} } @media(max-width:550px){.facts{grid-template-columns:1fr}body{padding-top:6.5rem}}
    </style>
  </head>
  <body>
    <nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html" aria-current="page">About</a><a href="contact.html">Contact</a></nav>

      <h1>About Sandeep.</h1>
      <p>I’m Sandeep—curious, creative, and always ready to turn a fresh idea into something useful. This is a small corner of the web where ideas get room to grow.</p>
      <section class="facts" aria-label="Highlights"><div class="fact"><strong>01</strong><span>Big ideas welcome</span></div><div class="fact"><strong>∞</strong><span>Curiosity included</span></div><div class="fact"><strong>Now</strong><span>Building what’s next</span></div></section>
      <a class="button" href="contact.html">Say hello →</a>
    </main>
  </body>
</html>
