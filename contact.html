<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>Contact Sandeep</title>
    <style>
      :root { color-scheme:dark; --ink:#f8fbff; --muted:#b6c1d8; --blue:#65d6ff; --pink:#ff79c6; } *{box-sizing:border-box} body{min-height:100vh;margin:0;padding:7rem 1.25rem 3rem;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 88% 8%,#c52b86 0,transparent 26rem),radial-gradient(circle at 8% 87%,#007fb3 0,transparent 29rem),#101827} nav{position:fixed;top:1.5rem;right:clamp(1.25rem,5vw,4rem);display:flex;gap:.45rem} nav a{padding:.55rem .85rem;border:1px solid rgba(255,255,255,.13);border-radius:999px;color:var(--ink);background:rgba(16,24,39,.45);text-decoration:none;font-size:.9rem;font-weight:700;backdrop-filter:blur(12px)} nav a:hover,nav a[aria-current="page"]{color:#06121d;background:var(--blue)} main{width:min(92vw,760px);margin:auto;padding:clamp(2rem,6vw,4.5rem);border:1px solid rgba(255,255,255,.2);border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:0 24px 80px rgba(0,0,0,.35);backdrop-filter:blur(18px)} .eyebrow{color:var(--blue);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase} h1{margin:.5rem 0 1rem;font-size:clamp(3rem,8vw,5.7rem);letter-spacing:-.07em;line-height:.95;background:linear-gradient(105deg,#fff,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent} p{color:var(--muted);font-size:1.1rem;line-height:1.7} form{display:grid;gap:1rem;margin-top:2rem} label{display:grid;gap:.45rem;color:var(--muted);font-size:.9rem;font-weight:700} input,textarea{width:100%;padding:.9rem 1rem;border:1px solid rgba(255,255,255,.18);border-radius:12px;color:var(--ink);background:rgba(8,16,30,.5);font:inherit;outline:none} input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(101,214,255,.15)} textarea{min-height:130px;resize:vertical} button{justify-self:start;padding:.85rem 1.25rem;border:0;border-radius:12px;color:#07121e;background:linear-gradient(135deg,var(--blue),#b3a0ff);font:inherit;font-weight:800;cursor:pointer} .note{margin-top:1rem;font-size:.85rem;color:var(--muted)}
    </style>
  </head>
  <body>
    <nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <main>
      <div class="eyebrow">Let’s connect</div>
      <h1>Say hello.</h1>
      <p>Have an idea, question, or just want to chat? Send a note below.</p>
      <form action="#" onsubmit="event.preventDefault(); document.getElementById('status').textContent='Thanks—your message is ready to send!';">
        <label>Name<input type="text" name="name" placeholder="Your name" required /></label>
        <label>Email<input type="email" name="email" placeholder="you@example.com" required /></label>
        <label>Message<textarea name="message" placeholder="What’s on your mind?" required></textarea></label>
        <button type="submit">Send message ✦</button>
      </form>
      <p class="note" id="status" aria-live="polite">This demo form stays right in your browser.</p>
    </main>
  </body>
</html>
