<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>Hi Name is Sandeep!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8fbff;
        --muted: #b6c1d8;
        --blue: #65d6ff;
        --violet: #9d7cff;
        --pink: #ff79c6;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #101827;
      }

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .7;
        animation: float 12s ease-in-out infinite alternate;
      }

      .orb--one { width: 28rem; height: 28rem; background: #553cc9; top: -13rem; left: -10rem; }
      .orb--two { width: 24rem; height: 24rem; background: #007fb3; right: -8rem; bottom: -10rem; animation-delay: -5s; }
      .orb--three { width: 12rem; height: 12rem; background: #c52b86; right: 18%; top: 10%; animation-delay: -8s; }

      main {
        width: min(92vw, 720px);
        position: relative;
        padding: clamp(2.5rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(255,255,255,.06));
        box-shadow: 0 24px 80px rgba(0, 0, 0, .35), inset 0 1px rgba(255,255,255,.15);
        backdrop-filter: blur(18px);
        animation: enter .8s cubic-bezier(.2,.8,.2,1) both;
      }

      .eyebrow {
        display: inline-flex;
        gap: .55rem;
        align-items: center;
        padding: .5rem .85rem;
        border-radius: 999px;
        color: #d9f7ff;
        background: rgba(101, 214, 255, .13);
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #6affc5; box-shadow: 0 0 14px #6affc5; }

      h1 {
        margin: 1.4rem 0 .85rem;
        font-size: clamp(3.3rem, 11vw, 7rem);
        line-height: .9;
        letter-spacing: -.075em;
        background: linear-gradient(105deg, #fff 14%, var(--blue) 45%, var(--pink) 92%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p { max-width: 40rem; margin: 0 auto; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.65; }

      .button {
        display: inline-block;
        margin-top: 2rem;
        padding: .85rem 1.25rem;
        border: 1px solid rgba(255,255,255,.28);
        border-radius: 12px;
        color: #07121e;
        background: linear-gradient(135deg, var(--blue), #b3a0ff);
        box-shadow: 0 10px 28px rgba(101,214,255,.23);
        font-weight: 800;
        text-decoration: none;
        transition: transform .2s ease, box-shadow .2s ease;
      }

      .button:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(101,214,255,.35); }

      @keyframes enter { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: none; } }
      @keyframes float { to { transform: translate(3rem, 2rem) scale(1.12); } }

      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>
    <div class="orb orb--three"></div>
    <main>
      <div class="eyebrow"><span class="dot"></span> A fresh start</div>
      <h1>Hi My name is Sandeep</h1>
      <p>A small page with a little bit of sparkle—ready for whatever you build next.</p>
      <a class="button" href="#hello" id="hello">Let’s create ✦</a>
    </main>
  </body>
</html>
